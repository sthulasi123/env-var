  name: env

on:
  workflow_dispatch:

env:
  appenv: "test"

jobs:
  envjob:
    runs-on: ubuntu-latest
    env:
      stepsenv: "prod"

    steps:
      - name: Print appenv
        run: echo "welcome to ${{ env.appenv }}"

      - name: Print envjob
        env:
          envjob: "dev"
        run: echo "welcome to ${{ env.envjob }}"

      - name: Print stepsenv
        run: echo "welcome to ${{ env.stepsenv }}"